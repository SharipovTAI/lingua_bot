openapi: 3.0.3
info:
  title: LinguaBot Backend — неделя 5
  version: 0.5.0
  description: Авторизация, диалоги с ИИ, входной тест, упражнения, словарь и прогресс.
paths:
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      tags:
      - Авторизация
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginInput'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
          description: ''
        '401':
          description: Неверный email или пароль
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      tags:
      - Авторизация
      security:
      - tokenAuth: []
      responses:
        '204':
          description: Токен отозван
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      tags:
      - Авторизация
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegistrationInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegistrationInput'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResult'
          description: ''
        '400':
          description: Ошибка проверки email или пароля
  /api/v1/conversations/:
    get:
      operationId: v1_conversations_list
      tags:
      - Диалоги
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConversationData'
          description: ''
    post:
      operationId: v1_conversations_create
      tags:
      - Диалоги
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationData'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConversationData'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConversationData'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationData'
          description: ''
  /api/v1/conversations/{conversation_id}/:
    get:
      operationId: v1_conversations_retrieve
      parameters:
      - in: path
        name: conversation_id
        schema:
          type: integer
        required: true
      tags:
      - Диалоги
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationData'
          description: ''
        '404':
          description: Диалог не найден или принадлежит другому пользователю
  /api/v1/conversations/{conversation_id}/messages/:
    get:
      operationId: v1_conversations_messages_list
      parameters:
      - in: path
        name: conversation_id
        schema:
          type: integer
        required: true
      tags:
      - Сообщения
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MessageData'
          description: ''
    post:
      operationId: v1_conversations_messages_create
      summary: Отправить сообщение и получить ответ ИИ с исправлением
      parameters:
      - in: path
        name: conversation_id
        schema:
          type: integer
        required: true
      tags:
      - Сообщения
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MessageInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MessageInput'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResult'
          description: ''
        '429':
          description: Превышена частота отправки
        '502':
          description: Ошибка ответа ИИ
        '503':
          description: ИИ недоступен
        '504':
          description: Истекло время ожидания ИИ
  /api/v1/dictionary/lookup/:
    get:
      operationId: v1_dictionary_lookup_retrieve
      parameters:
      - in: query
        name: target
        schema:
          type: string
          enum:
          - de
          - en
          - ru
      - in: query
        name: word
        schema:
          type: string
        required: true
      tags:
      - Внешний словарь
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupData'
          description: ''
  /api/v1/exercises/:
    get:
      operationId: v1_exercises_list
      parameters:
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - grammar
          - vocabulary
      tags:
      - Упражнения
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExerciseData'
          description: ''
  /api/v1/exercises/{exercise_id}/attempts/:
    post:
      operationId: v1_exercises_attempts_create
      parameters:
      - in: path
        name: exercise_id
        schema:
          type: integer
        required: true
      tags:
      - Упражнения
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PracticeAnswerInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PracticeAnswerInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PracticeAnswerInput'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptData'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptData'
          description: ''
  /api/v1/health/:
    get:
      operationId: v1_health_retrieve
      tags:
      - Готово — неделя 1
      security:
      - {}
      responses:
        '200':
          description: Сервер и база отвечают
        '503':
          description: База недоступна
  /api/v1/notes/:
    get:
      operationId: v1_notes_list
      tags:
      - v1
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NoteData'
          description: ''
    post:
      operationId: v1_notes_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteData'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NoteData'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NoteData'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteData'
          description: ''
  /api/v1/notes/{id}/:
    get:
      operationId: v1_notes_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteData'
          description: ''
    put:
      operationId: v1_notes_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteData'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NoteData'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NoteData'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteData'
          description: ''
    patch:
      operationId: v1_notes_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedNoteData'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedNoteData'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedNoteData'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteData'
          description: ''
    delete:
      operationId: v1_notes_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/placement/:
    get:
      operationId: v1_placement_list
      tags:
      - Входной тест
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExerciseData'
          description: ''
    post:
      operationId: v1_placement_create
      tags:
      - Входной тест
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlacementInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PlacementInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PlacementInput'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlacementData'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlacementData'
          description: ''
  /api/v1/profile/:
    get:
      operationId: v1_profile_retrieve
      tags:
      - Профиль
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileData'
          description: ''
    patch:
      operationId: v1_profile_partial_update
      tags:
      - Профиль
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileData'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfileData'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfileData'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileData'
          description: ''
  /api/v1/scenarios/:
    get:
      operationId: v1_scenarios_list
      summary: Получить справочник сценариев из SQLite
      tags:
      - Готово — неделя 1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Scenario'
          description: ''
  /api/v1/statistics/:
    get:
      operationId: v1_statistics_retrieve
      tags:
      - Прогресс
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatisticsData'
          description: ''
  /api/v1/vocabulary/:
    get:
      operationId: v1_vocabulary_list
      tags:
      - Словарь
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VocabularyData'
          description: ''
    post:
      operationId: v1_vocabulary_create
      tags:
      - Словарь
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VocabularyInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VocabularyInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VocabularyInput'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VocabularyData'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VocabularyData'
          description: ''
  /api/v1/vocabulary/{word_id}/:
    patch:
      operationId: v1_vocabulary_partial_update
      parameters:
      - in: path
        name: word_id
        schema:
          type: integer
        required: true
      tags:
      - Словарь
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedVocabularyInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedVocabularyInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedVocabularyInput'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VocabularyData'
          description: ''
    delete:
      operationId: v1_vocabulary_destroy
      parameters:
      - in: path
        name: word_id
        schema:
          type: integer
        required: true
      tags:
      - Словарь
      security:
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/vocabulary/{word_id}/reviews/:
    post:
      operationId: v1_vocabulary_reviews_create
      parameters:
      - in: path
        name: word_id
        schema:
          type: integer
        required: true
      tags:
      - Словарь
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReviewInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReviewInput'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewData'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewData'
          description: ''
  /api/v1/vocabulary/review/:
    get:
      operationId: v1_vocabulary_review_list
      tags:
      - Словарь
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReviewCard'
          description: ''
components:
  schemas:
    AttemptData:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        request_id:
          type: string
          format: uuid
          nullable: true
        exercise_id:
          type: integer
          readOnly: true
        answer:
          type: string
        is_correct:
          type: boolean
        correct_answer:
          type: string
          readOnly: true
        explanation:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - answer
      - correct_answer
      - created_at
      - exercise_id
      - explanation
      - id
      - is_correct
    ConversationData:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        scenario_id:
          type: integer
        scenario_title:
          type: string
          readOnly: true
        language:
          allOf:
          - $ref: '#/components/schemas/LanguageEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - language
      - scenario_id
      - scenario_title
    CorrectionData:
      type: object
      properties:
        topic:
          type: string
        original:
          type: string
        corrected:
          type: string
        explanation:
          type: string
      required:
      - corrected
      - explanation
      - original
    ExerciseData:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        level:
          $ref: '#/components/schemas/LevelEnum'
        kind:
          $ref: '#/components/schemas/KindEnum'
        topic:
          type: string
          maxLength: 80
        question:
          type: string
        options: {}
        language:
          $ref: '#/components/schemas/LanguageEnum'
      required:
      - id
      - kind
      - level
      - question
      - title
    KindEnum:
      enum:
      - grammar
      - vocabulary
      type: string
      description: |-
        * `grammar` - Грамматика
        * `vocabulary` - Лексика
    LanguageEnum:
      enum:
      - en
      - de
      - ru
      type: string
      description: |-
        * `en` - Английский
        * `de` - Немецкий
        * `ru` - Русский
    LevelEnum:
      enum:
      - A1
      - A2
      - B1
      - B2
      - C1
      type: string
      description: |-
        * `A1` - A1
        * `A2` - A2
        * `B1` - B1
        * `B2` - B2
        * `C1` - C1
    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 150
        password:
          type: string
          writeOnly: true
          maxLength: 128
      required:
      - email
      - password
    LoginResult:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/UserData'
      required:
      - token
      - user
    LookupData:
      type: object
      properties:
        word:
          type: string
        language:
          type: string
        target:
          type: string
        translation:
          type: string
        definitions:
          type: array
          items:
            type: string
        examples:
          type: array
          items:
            type: string
        source:
          type: string
        source_url:
          type: string
          format: uri
        translation_url:
          type: string
          format: uri
      required:
      - definitions
      - examples
      - language
      - source
      - source_url
      - target
      - translation
      - translation_url
      - word
    MessageData:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        content:
          type: string
          readOnly: true
        feedback:
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - content
      - created_at
      - feedback
      - id
      - role
    MessageInput:
      type: object
      properties:
        request_id:
          type: string
          format: uuid
        content:
          type: string
          maxLength: 2000
      required:
      - content
    MessageResult:
      type: object
      properties:
        user_message:
          $ref: '#/components/schemas/MessageData'
        assistant_message:
          $ref: '#/components/schemas/MessageData'
        feedback:
          type: array
          items:
            $ref: '#/components/schemas/CorrectionData'
      required:
      - assistant_message
      - feedback
      - user_message
    NoteData:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 120
        content:
          type: string
          maxLength: 5000
        language:
          allOf:
          - $ref: '#/components/schemas/LanguageEnum'
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - content
      - id
      - language
      - title
      - updated_at
    PatchedNoteData:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 120
        content:
          type: string
          maxLength: 5000
        language:
          allOf:
          - $ref: '#/components/schemas/LanguageEnum'
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedProfileData:
      type: object
      properties:
        level:
          $ref: '#/components/schemas/LevelEnum'
        goal:
          type: string
          maxLength: 200
        language:
          $ref: '#/components/schemas/LanguageEnum'
    PatchedVocabularyInput:
      type: object
      properties:
        word:
          type: string
          maxLength: 100
        translation:
          type: string
          maxLength: 200
    PlacementAnswer:
      type: object
      properties:
        exercise_id:
          type: integer
          minimum: 1
        answer:
          type: string
          maxLength: 2000
      required:
      - answer
      - exercise_id
    PlacementData:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        request_id:
          type: string
          format: uuid
        score:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        total:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        level:
          $ref: '#/components/schemas/LevelEnum'
        language:
          $ref: '#/components/schemas/LanguageEnum'
        band:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - band
      - created_at
      - id
      - level
      - request_id
      - score
      - total
    PlacementInput:
      type: object
      properties:
        request_id:
          type: string
          format: uuid
        answers:
          type: array
          items:
            $ref: '#/components/schemas/PlacementAnswer'
      required:
      - answers
      - request_id
    PracticeAnswerInput:
      type: object
      properties:
        answer:
          type: string
          maxLength: 2000
        request_id:
          type: string
          format: uuid
      required:
      - answer
      - request_id
    ProfileData:
      type: object
      properties:
        level:
