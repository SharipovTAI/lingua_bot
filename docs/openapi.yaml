components:
  schemas:
    AttemptInput:
      type: object
      properties:
        answer:
          type: string
          maxLength: 2000
      required:
      - answer
    ConversationInput:
      type: object
      properties:
        scenario_id:
          type: integer
          minimum: 1
      required:
      - scenario_id
    LanguageEnum:
      enum:
      - en
      type: string
      description: '* `en` - en'
    LevelEnum:
      enum:
      - A1
      - A2
      - B1
      - B2
      - C1
      type: string
      description: |-
        * `A1` - A1
        * `A2` - A2
        * `B1` - B1
        * `B2` - B2
        * `C1` - C1
    MessageInput:
      type: object
      properties:
        content:
          type: string
          maxLength: 2000
      required:
      - content
    PatchedProfileData:
      type: object
      properties:
        level:
          $ref: '#/components/schemas/LevelEnum'
        goal:
          type: string
          maxLength: 200
        language:
          $ref: '#/components/schemas/LanguageEnum'
    RegistrationInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
          minLength: 8
      required:
      - email
      - password
    Scenario:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          maxLength: 100
        description:
          type: string
      required:
      - description
      - id
      - slug
      - title
