openapi: 3.0.3
info:
  title: LinguaBot Backend — неделя 2
  version: 0.2.0
  description: 'Работают регистрация, вход, профиль, диалоги и сохранение сообщений.
    Для доступа: Authorization: Token <token>. Ответы ИИ относятся к неделе 3; упражнения
    и статистика — к неделе 4.'
paths:
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      tags:
      - Авторизация
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginInput'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
          description: ''
        '401':
          description: Неверный email или пароль
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      tags:
      - Авторизация
      security:
      - tokenAuth: []
      responses:
        '204':
          description: Токен отозван
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      tags:
      - Авторизация
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegistrationInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegistrationInput'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResult'
          description: ''
        '400':
          description: Ошибка проверки email или пароля
  /api/v1/conversations/:
    get:
      operationId: v1_conversations_list
      tags:
      - Диалоги
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConversationData'
          description: ''
    post:
      operationId: v1_conversations_create
      tags:
      - Диалоги
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationData'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConversationData'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConversationData'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationData'
          description: ''
  /api/v1/conversations/{conversation_id}/:
    get:
      operationId: v1_conversations_retrieve
      parameters:
      - in: path
        name: conversation_id
        schema:
          type: integer
        required: true
      tags:
      - Диалоги
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationData'
          description: ''
        '404':
          description: Диалог не найден или принадлежит другому пользователю
  /api/v1/conversations/{conversation_id}/messages/:
    get:
      operationId: v1_conversations_messages_list
      parameters:
      - in: path
        name: conversation_id
        schema:
          type: integer
        required: true
      tags:
      - Сообщения
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MessageData'
          description: ''
    post:
      operationId: v1_conversations_messages_create
      summary: Сохранить сообщение пользователя без вызова ИИ
      parameters:
      - in: path
        name: conversation_id
        schema:
          type: integer
        required: true
      tags:
      - Сообщения
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MessageInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MessageInput'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResult'
          description: ''
  /api/v1/exercises/:
    get:
      operationId: v1_exercises_retrieve
      tags:
      - Неделя 4 — контракт
      security:
      - tokenAuth: []
      responses:
        '501':
          description: Операция запланирована, бизнес-логика ещё не реализована
  /api/v1/exercises/{exercise_id}/attempts/:
    post:
      operationId: v1_exercises_attempts_create
      parameters:
      - in: path
        name: exercise_id
        schema:
          type: integer
        required: true
      tags:
      - Неделя 4 — контракт
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttemptInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AttemptInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AttemptInput'
        required: true
      security:
      - tokenAuth: []
      responses:
        '501':
          description: Операция запланирована, бизнес-логика ещё не реализована
  /api/v1/health/:
    get:
      operationId: v1_health_retrieve
      tags:
      - Готово — неделя 1
      security:
      - {}
      responses:
        '200':
          description: Сервер и база отвечают
        '503':
          description: База недоступна
  /api/v1/profile/:
    get:
      operationId: v1_profile_retrieve
      tags:
      - Профиль
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileData'
          description: ''
    patch:
      operationId: v1_profile_partial_update
      tags:
      - Профиль
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileData'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfileData'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfileData'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileData'
          description: ''
  /api/v1/scenarios/:
    get:
      operationId: v1_scenarios_list
      summary: Получить справочник сценариев из SQLite
      tags:
      - Готово — неделя 1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Scenario'
          description: ''
  /api/v1/statistics/:
    get:
      operationId: v1_statistics_retrieve
      tags:
      - Неделя 4 — контракт
      security:
      - tokenAuth: []
      responses:
        '501':
          description: Операция запланирована, бизнес-логика ещё не реализована
components:
  schemas:
    AttemptInput:
      type: object
      properties:
        answer:
          type: string
          maxLength: 2000
      required:
      - answer
    ConversationData:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        scenario_id:
          type: integer
        scenario_title:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - scenario_id
      - scenario_title
    LanguageEnum:
      enum:
      - en
      type: string
      description: '* `en` - en'
    LevelEnum:
      enum:
      - A1
      - A2
      - B1
      - B2
      - C1
      type: string
      description: |-
        * `A1` - A1
        * `A2` - A2
        * `B1` - B1
        * `B2` - B2
        * `C1` - C1
    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 150
        password:
          type: string
          writeOnly: true
          maxLength: 128
      required:
      - email
      - password
    LoginResult:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/UserData'
      required:
      - token
      - user
    MessageData:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        content:
          type: string
          readOnly: true
        feedback:
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - content
      - created_at
      - feedback
      - id
      - role
    MessageInput:
      type: object
      properties:
        content:
          type: string
          maxLength: 2000
      required:
      - content
    MessageResult:
      type: object
      properties:
        user_message:
          $ref: '#/components/schemas/MessageData'
        assistant_message:
          allOf:
          - $ref: '#/components/schemas/MessageData'
          nullable: true
        feedback:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - assistant_message
      - feedback
      - user_message
    PatchedProfileData:
      type: object
      properties:
        level:
          $ref: '#/components/schemas/LevelEnum'
        goal:
          type: string
          maxLength: 200
        language:
          $ref: '#/components/schemas/LanguageEnum'
    ProfileData:
      type: object
      properties:
        level:
          $ref: '#/components/schemas/LevelEnum'
        goal:
          type: string
          maxLength: 200
        language:
          $ref: '#/components/schemas/LanguageEnum'
    RegistrationInput:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 150
        password:
          type: string
          writeOnly: true
          maxLength: 128
      required:
      - email
      - password
    RegistrationResult:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserData'
      required:
      - user
    RoleEnum:
      enum:
      - user
      - assistant
      type: string
      description: |-
        * `user` - user
        * `assistant` - assistant
    Scenario:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          maxLength: 100
        description:
          type: string
      required:
      - description
      - id
      - slug
      - title
    UserData:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          title: Адрес электронной почты
          maxLength: 254
      required:
      - id
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
